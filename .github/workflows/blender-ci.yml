name: Blender MCP CI

on:
  push:
    branches: [main]
    paths:
      - "blender/**"
      - ".github/workflows/blender-ci.yml"
  pull_request:
    paths:
      - "blender/**"
      - ".github/workflows/blender-ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: blender

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Ruff lint
        run: uv run ruff check .
      - name: Pyright typecheck
        run: uv run pyright
      - name: Unit tests & security audit
        run: uv run pytest tests/unit -v
      - name: Verify generated schema docs are up to date
        run: uv run python scripts/generate_docs.py && git diff --exit-code -- docs/TOOLS_REFERENCE.md

  integration-blender:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        blender:
          - { version: "3.6.18", url: "https://download.blender.org/release/Blender3.6/blender-3.6.18-linux-x64.tar.xz" }
          - { version: "4.2.7", url: "https://download.blender.org/release/Blender4.2/blender-4.2.7-linux-x64.tar.xz" }
          - { version: "4.5.0", url: "https://download.blender.org/release/Blender4.5/blender-4.5.0-linux-x64.tar.xz" }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install system libs for Blender headless
        run: sudo apt-get update && sudo apt-get install -y libxrender1 libxi6 libxkbcommon0 libgl1 libegl1 libsm6
      - name: Download Blender ${{ matrix.blender.version }}
        run: |
          curl -fsSL "${{ matrix.blender.url }}" -o /tmp/blender.tar.xz
          mkdir -p "$HOME/blender"
          tar -xf /tmp/blender.tar.xz -C "$HOME/blender" --strip-components=1
          rm -f /tmp/blender.tar.xz
          echo "BLENDER_MCP_BLENDER_PATH=$HOME/blender/blender" >> "$GITHUB_ENV"
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Run integration, evals & performance tests against Blender ${{ matrix.blender.version }}
        run: uv run pytest tests/integration tests/evals tests/benchmarks -m integration -v
