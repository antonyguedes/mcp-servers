<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" role="img" aria-label="mcp-servers — Model Context Protocol servers connecting AI agents to desktop and creative software" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060a14" />
      <stop offset="50%" stop-color="#0c1426" />
      <stop offset="100%" stop-color="#111b33" />
    </linearGradient>
    <linearGradient id="title-grad" x1="560" y1="0" x2="880" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="52%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="border-grad" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="35%" stop-color="#818cf8" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0.6" />
    </linearGradient>
    <radialGradient id="glow-left" cx="15%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0c1426" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-center" cx="50%" cy="52%" r="46%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#0c1426" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-right" cx="86%" cy="28%" r="46%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0c1426" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334b7a" stroke-width="0.65" stroke-opacity="0.26" />
    </pattern>
  </defs>

  <!-- Base Obsidian Canvas -->
  <rect x="2" y="2" width="1196" height="316" rx="24" fill="url(#bg)" />
  <rect x="2" y="2" width="1196" height="316" rx="24" fill="url(#grid)" />
  <rect x="2" y="2" width="1196" height="316" rx="24" fill="url(#glow-left)" />
  <rect x="2" y="2" width="1196" height="316" rx="24" fill="url(#glow-center)" />
  <rect x="2" y="2" width="1196" height="316" rx="24" fill="url(#glow-right)" />
  <rect x="2" y="2" width="1196" height="316" rx="24" stroke="url(#border-grad)" stroke-width="2" />

  <!-- Subtle Protocol Topology Lines (Left & Right) -->
  <g stroke="#38bdf8" stroke-opacity="0.16" stroke-width="1.4" stroke-linecap="round">
    <path d="M 52 94 H 116 L 148 126 H 192" />
    <path d="M 52 160 H 164" />
    <path d="M 52 226 H 116 L 148 194 H 192" />
    <circle cx="52" cy="94" r="3.5" fill="#38bdf8" fill-opacity="0.4" />
    <circle cx="52" cy="160" r="3.5" fill="#818cf8" fill-opacity="0.45" />
    <circle cx="52" cy="226" r="3.5" fill="#34d399" fill-opacity="0.4" />
  </g>
  <g stroke="#fb923c" stroke-opacity="0.16" stroke-width="1.4" stroke-linecap="round">
    <path d="M 1148 94 H 1084 L 1052 126 H 1008" />
    <path d="M 1148 160 H 1036" />
    <path d="M 1148 226 H 1084 L 1052 194 H 1008" />
    <circle cx="1148" cy="94" r="3.5" fill="#fb923c" fill-opacity="0.45" />
    <circle cx="1148" cy="160" r="3.5" fill="#c084fc" fill-opacity="0.45" />
    <circle cx="1148" cy="226" r="3.5" fill="#38bdf8" fill-opacity="0.4" />
  </g>

  <!-- Subtle Concentric Protocol Rings -->
  <g fill="none" stroke="#818cf8" stroke-opacity="0.11" stroke-width="1.3">
    <circle cx="600" cy="144" r="150" stroke-dasharray="6 7" />
    <circle cx="600" cy="144" r="240" />
    <circle cx="600" cy="144" r="340" stroke-dasharray="4 9" stroke="#38bdf8" stroke-opacity="0.1" />
  </g>

  <!-- Ambient Accent Dots -->
  <circle cx="220" cy="64" r="2" fill="#38bdf8" opacity="0.75" />
  <circle cx="285" cy="272" r="1.6" fill="#34d399" opacity="0.6" />
  <circle cx="930" cy="60" r="2" fill="#c084fc" opacity="0.75" />
  <circle cx="995" cy="268" r="1.8" fill="#fb923c" opacity="0.7" />

  <!-- Top Eyebrow Pill -->
  <rect x="330" y="28" width="540" height="28" rx="14" fill="#131f3a" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1" />
  <circle cx="352" cy="42" r="4" fill="#38bdf8" />
  <text x="608" y="46" text-anchor="middle" fill="#cbd5f5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4">
    MODEL CONTEXT PROTOCOL · AI AGENTS · SOFTWARE BRIDGES
  </text>

  <!-- Custom MCP Hub Mark + Title -->
  <g transform="translate(330, 84)">
    <rect width="62" height="62" rx="16" fill="#131f3a" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1.5" />
    <!-- Connected Hub Nodes Icon -->
    <line x1="18" y1="20" x2="31" y2="31" stroke="#38bdf8" stroke-width="2.6" stroke-linecap="round" />
    <line x1="18" y1="42" x2="31" y2="31" stroke="#34d399" stroke-width="2.6" stroke-linecap="round" />
    <line x1="44" y1="20" x2="31" y2="31" stroke="#c084fc" stroke-width="2.6" stroke-linecap="round" />
    <line x1="44" y1="42" x2="31" y2="31" stroke="#fb923c" stroke-width="2.6" stroke-linecap="round" />
    <circle cx="18" cy="20" r="4.5" fill="#0c1426" stroke="#38bdf8" stroke-width="2.4" />
    <circle cx="18" cy="42" r="4.5" fill="#0c1426" stroke="#34d399" stroke-width="2.4" />
    <circle cx="44" cy="20" r="4.5" fill="#0c1426" stroke="#c084fc" stroke-width="2.4" />
    <circle cx="44" cy="42" r="4.5" fill="#0c1426" stroke="#fb923c" stroke-width="2.4" />
    <circle cx="31" cy="31" r="6.5" fill="#818cf8" />
    <circle cx="31" cy="31" r="2.6" fill="#f4f7ff" />
  </g>
  <text x="412" y="136" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="64" font-weight="800" letter-spacing="-2">
    <tspan fill="#f4f7ff">mcp-</tspan><tspan fill="url(#title-grad)">servers</tspan>
  </text>

  <!-- Subtitle -->
  <text x="600" y="182" text-anchor="middle" fill="#cbd5f5" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16.5" font-weight="400">
    Production-grade MCP servers connecting AI agents to desktop &amp; creative software
  </text>

  <!-- 4 Architecture Pillar Pills -->
  <g transform="translate(132, 224)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.8" font-weight="600">
    <!-- 01 ANY CLIENT -->
    <rect x="0" y="0" width="214" height="36" rx="11" fill="#0d172e" stroke="#38bdf8" stroke-width="1.3" />
    <circle cx="18" cy="18" r="3.6" fill="#38bdf8" />
    <text x="32" y="22" text-anchor="start" fill="#f4f7ff" letter-spacing="0.5">01 · ANY MCP CLIENT</text>

    <line x1="220" y1="18" x2="236" y2="18" stroke="#475e8c" stroke-width="1.5" stroke-dasharray="3 3" />

    <!-- 02 STDIO & HTTP -->
    <rect x="242" y="0" width="210" height="36" rx="11" fill="#0d172e" stroke="#818cf8" stroke-width="1.3" />
    <circle cx="260" cy="18" r="3.6" fill="#818cf8" />
    <text x="274" y="22" text-anchor="start" fill="#f4f7ff" letter-spacing="0.5">02 · STDIO &amp; HTTP</text>

    <line x1="458" y1="18" x2="474" y2="18" stroke="#475e8c" stroke-width="1.5" stroke-dasharray="3 3" />

    <!-- 03 SECURE DEFAULTS -->
    <rect x="480" y="0" width="222" height="36" rx="11" fill="#0d172e" stroke="#34d399" stroke-width="1.3" />
    <circle cx="498" cy="18" r="3.6" fill="#34d399" />
    <text x="512" y="22" text-anchor="start" fill="#f4f7ff" letter-spacing="0.5">03 · SECURE DEFAULTS</text>

    <line x1="708" y1="18" x2="724" y2="18" stroke="#475e8c" stroke-width="1.5" stroke-dasharray="3 3" />

    <!-- 04 MODULAR SERVERS -->
    <rect x="730" y="0" width="206" height="36" rx="11" fill="#0d172e" stroke="#fb923c" stroke-width="1.3" />
    <circle cx="748" cy="18" r="3.6" fill="#fb923c" />
    <text x="762" y="22" text-anchor="start" fill="#f4f7ff" letter-spacing="0.5">04 · MODULAR APPS</text>
  </g>
</svg>
