[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "blender-mcp"
version = "1.0.0"
description = "Production-grade MCP server connecting AI agents to Blender 3D (3.6 LTS - 5.3+)"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Antony Guedes" }]
dependencies = [
    "mcp>=2.0.0",
    "pydantic>=2.7.0",
    "pillow>=10.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
blender-mcp = "blender_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/antonyguedes/mcp-servers"
Repository = "https://github.com/antonyguedes/mcp-servers"
Issues = "https://github.com/antonyguedes/mcp-servers/issues"

[tool.hatch.build.targets.wheel]
packages = [
    "packages/protocol/blender_mcp_protocol",
    "packages/server/blender_mcp",
]

[tool.hatch.build.targets.wheel.force-include]
"packages/addon/LICENSE" = "blender_mcp/_bundled_addon/LICENSE"
"packages/addon/blender_manifest.toml" = "blender_mcp/_bundled_addon/blender_manifest.toml"
"packages/addon/bootstrap.py" = "blender_mcp/_bundled_addon/bootstrap.py"
"packages/addon/blender_mcp_addon" = "blender_mcp/_bundled_addon/blender_mcp_addon"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
    "pyright>=1.1.390",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = [
    "packages/protocol",
    "packages/server",
    "packages/addon",
    "tests",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["blender_mcp", "blender_mcp_protocol", "blender_mcp_addon", "tests"]

[tool.ruff.lint.per-file-ignores]
# Add-on and protocol must stay Python 3.10+ compatible (Blender 3.6 LTS)
"packages/addon/**/*.py" = ["UP007", "UP017", "UP035", "UP041", "UP042", "SIM105"]
"packages/protocol/**/*.py" = ["UP007", "UP017", "UP035", "UP042"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: tests that launch a real headless Blender process",
]

[tool.pyright]
pythonVersion = "3.11"
include = ["packages/protocol", "packages/server"]
exclude = ["packages/addon", "**/__pycache__", "skills"]
typeCheckingMode = "standard"
