[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "blender-mcp"
version = "1.0.0"
description = "Production-grade MCP server connecting AI agents to Blender 3D (3.6 LTS - 5.3+)"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Antony Guedes" }]
dependencies = [
    "blender-mcp-protocol",
    "mcp>=2.0.0",
    "pydantic>=2.7.0",
    "pillow>=10.0.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/antonyguedes/mcp-servers"
Repository = "https://github.com/antonyguedes/mcp-servers"
Issues = "https://github.com/antonyguedes/mcp-servers/issues"

[project.scripts]
blender-mcp = "blender_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["blender_mcp"]
